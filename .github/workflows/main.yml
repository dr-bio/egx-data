name: Test tvDatafeed

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install tvdatafeed pandas
      - name: Test EGX Data
        run: python -c "from tvDatafeed import TvDatafeed, Interval; tv = TvDatafeed(); df = tv.get_hist(symbol='COMI', exchange='EGX', interval=Interval.in_daily, n_bars=10); print('SUCCESS' if df is not None else 'FAILED'); print(df)"
