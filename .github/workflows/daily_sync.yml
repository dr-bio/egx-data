
name: Daily EGX Sync

on:
  schedule:
    - cron: '15 13 * * 0-4'  # 3:15pm Cairo (UTC+2) = 1:15pm UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install git+https://github.com/rongardF/tvdatafeed.git pandas
      - name: Sync EGX Data
        run: python scripts/sync_daily.py
      - name: Commit Data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily sync $(date +'%Y-%m-%d')"
          git push
